<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Clock & Custom Widgets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

        :root {
            --bg-base: #0a0a0a;
            --card-bg: #141414;
            --text-color: #f5f5f5;
            --accent-color: #a3a3a3;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(20, 20, 20, 0.6);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .clock-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .min-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            transition: border-color 0.3s ease, background-color 0.3s ease, transform 0.2s ease;
        }

        .min-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .glass-nav {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .accent-text { 
            color: var(--accent-color); 
        }

        @keyframes subtlePulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.9); }
        }

        .colon-dot {
            animation: subtlePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background-color: var(--text-color);
        }

        .digit-flip {
            display: inline-block;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
        }

        .digit-flip.changing {
            transform: translateY(-10px);
            opacity: 0.2;
        }

        #settings-modal-box::-webkit-scrollbar {
            width: 5px;
        }
        #settings-modal-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative">

    <header class="w-full p-6 flex justify-between items-center max-w-6xl mx-auto z-30">
        <div class="flex items-center gap-3">
            <span class="font-semibold text-sm tracking-widest uppercase opacity-80">MINIMAL<span class="accent-text">CLOCK</span></span>
        </div>

        <div class="flex items-center gap-3">
            <button id="settings-btn" class="p-2.5 rounded-full glass-nav hover:bg-white/10 active:scale-95 transition-all flex items-center gap-2 text-xs font-medium">
                <i data-lucide="settings" class="w-4 h-4 opacity-80"></i>
                <span class="hidden sm:inline">Settings & Widgets</span>
            </button>
            <button id="sound-btn" class="p-2.5 rounded-full glass-nav hover:bg-white/10 active:scale-95 transition-all">
                <i data-lucide="volume-x" id="sound-icon" class="w-4 h-4 opacity-70"></i>
            </button>
            <button id="fullscreen-btn" class="p-2.5 rounded-full glass-nav hover:bg-white/10 active:scale-95 transition-all">
                <i data-lucide="maximize" class="w-4 h-4 opacity-70"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col justify-center items-center px-4 w-full z-10 max-w-5xl mx-auto py-6">
        
        <div id="date-display" class="mb-8 text-xs sm:text-sm font-medium tracking-widest uppercase opacity-50 tracking-[0.2em]">
            Friday, Aug 28 2026
        </div>

        <div class="flex items-center justify-center gap-3 sm:gap-6 clock-font mb-12">
            
            <div class="min-card w-20 h-28 sm:w-36 sm:h-48 rounded-2xl flex items-center justify-center shadow-2xl relative">
                <span id="hours-display" class="digit-flip text-4xl sm:text-7xl font-light">12</span>
                <span id="ampm-display" class="hidden absolute bottom-2 right-3 text-[10px] sm:text-xs font-bold tracking-widest opacity-60">AM</span>
            </div>

            <div class="flex flex-col gap-3 justify-center items-center px-1">
                <div class="colon-dot w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full"></div>
                <div class="colon-dot w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full"></div>
            </div>

            <div class="min-card w-20 h-28 sm:w-36 sm:h-48 rounded-2xl flex items-center justify-center shadow-2xl">
                <span id="minutes-display" class="digit-flip text-4xl sm:text-7xl font-light">37</span>
            </div>

            <div id="seconds-group" class="flex items-center gap-3 sm:gap-6">
                <div class="flex flex-col gap-3 justify-center items-center px-1">
                    <div class="colon-dot w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full"></div>
                    <div class="colon-dot w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full"></div>
                </div>

                <div class="min-card w-20 h-28 sm:w-36 sm:h-48 rounded-2xl flex items-center justify-center shadow-2xl">
                    <span id="seconds-display" class="digit-flip text-4xl sm:text-7xl font-light">18</span>
                </div>
            </div>

        </div>

        <div id="widgets-container" class="w-full grid grid-cols-1 md:grid-cols-3 gap-4 transition-all duration-300">
            
            <div id="widget-pomodoro" class="min-card rounded-2xl p-4 flex flex-col justify-between space-y-3">
                <div class="flex justify-between items-center text-xs font-medium opacity-60 uppercase tracking-wider">
                    <span class="flex items-center gap-1.5"><i data-lucide="timer" class="w-3.5 h-3.5"></i> Focus Timer</span>
                    <span id="pomo-status">Ready</span>
                </div>
                <div class="text-center clock-font text-3xl font-light my-1" id="pomo-display">25:00</div>
                <div class="flex justify-center gap-2">
                    <button id="pomo-start-btn" class="px-3 py-1 rounded-lg glass-nav text-xs hover:bg-white/10 transition-all">Start</button>
                    <button id="pomo-reset-btn" class="px-3 py-1 rounded-lg glass-nav text-xs hover:bg-white/10 transition-all opacity-60
