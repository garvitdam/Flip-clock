<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Minimalist Timepiece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-base: #070709;
            --card-bg: rgba(255, 255, 255, 0.025);
            --card-hover: rgba(255, 255, 255, 0.05);
            --text-color: #f8fafc;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --border-color: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.18);
            --glass-bg: rgba(18, 18, 24, 0.7);
            --spring-transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% -20%, #171825 0%, #070709 65%);
            background-attachment: fixed;
            color: var(--text-color);
            user-select: none;
            overflow-x: hidden;
            transition: var(--spring-transition);
        }

        .clock-font { font-family: 'JetBrains Mono', monospace; }

        .modern-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            transition: var(--spring-transition);
        }

        .modern-card:hover {
            background-color: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 30px 0 var(--accent-glow);
        }

        .glass-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            transition: var(--spring-transition);
        }

        .glass-btn:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.1);
        }

        .colon-dot {
            animation: pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background-color: var(--text-color);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }

        .digit-flip {
            display: inline-block;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }

        .digit-flip.changing {
            transform: translateY(-12px) scale(0.9);
            opacity: 0;
        }

        .todo-scroll::-webkit-scrollbar, .modal-scroll::-webkit-scrollbar { width: 4px; }
        .todo-scroll::-webkit-scrollbar-thumb, .modal-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }

        .zen-hidden {
            opacity: 0 !important;
            transform: scale(0.98) !important;
            pointer-events: none !important;
        }

        .timer-btn-active {
            background: rgba(255, 255, 255, 0.9) !important;
            color: #000 !important;
            font-weight: 600;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative p-4 sm:p-8">

    <header id="main-header" class="w-full max-w-6xl mx-auto flex justify-between items-center z-30 transition-all duration-500 mb-6">
        <div class="flex items-center gap-3">
            <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></div>
            <span class="font-bold text-xs tracking-[0.3em] uppercase opacity-90">STUDIO<span class="text-indigo-400">TIME</span></span>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <button id="soundscape-btn" class="px-3 py-2 rounded-2xl glass-btn flex items-center gap-2 text-xs font-medium">
