<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Clock & Custom Widgets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-base: #08080a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.06);
            --text-color: #f8fafc;
            --accent-color: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --glass-bg: rgba(15, 15, 20, 0.65);
            --spring-transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 30%, #151622 0%, #08080a 70%);
            background-attachment: fixed;
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            transition: var(--spring-transition);
        }

        .clock-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Glassmorphic Cards with Smooth Hover */
        .min-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transition: var(--spring-transition);
            will-change: transform, border-color, background-color, box-shadow;
        }

        .min-card:hover {
            background-color: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 20px 0 rgba(255, 255, 255, 0.03);
        }

        .glass-nav {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            transition: var(--spring-transition);
        }

        .glass-nav:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.12);
        }

        .accent-text { 
            color: var(--accent-color); 
        }

        @keyframes smoothPulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.25; transform: scale(0.85); }
        }

        .colon-dot {
            animation: smoothPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background-color: var(--text-color);
        }

        /* Fluid Digit Flip Animation */
        .digit-flip {
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
            will-change: transform, opacity;
        }

        .digit-flip.changing {
            transform: translateY(-14px) scale(0.92);
            opacity: 0;
        }

        .todo-scroll::-webkit-scrollbar,
        #settings-modal-box::-webkit-scrollbar {
            width: 4px;
        }
        .todo-scroll::-webkit-scrollbar-thumb,
        #settings-modal-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }

        .zen-hidden {
            opacity: 0 !important;
            transform: scale(0.98) !important;
            pointer-events: none !important;
        }

        /* Lock Screen */
        #lock-screen {
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            background: rgba(8, 8, 10, 0.88);
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        #lock-screen.unlocked {
            transform: translateY(-100%) scale(1.05);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes floatPulse {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
            50% { transform: translateY(-6px) scale(1.05); opacity: 1; }
        }

        .lock-pulse {
            animation: floatPulse 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Modal Smooth Animations */
        .modal-wrapper {
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), backdrop-filter 0.35s ease;
        }

        .modal-box {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
            will-change: transform, opacity;
        }

        .habit-chip {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, color 0.2s ease;
        }
        .habit-chip:active {
            transform: scale(0.88);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative">

    <div id="lock-screen" class="fixed inset-0 z-50 flex flex-col justify-between p-8 sm:p-12 cursor-pointer select-none">
        <div class="flex justify-between items-center opacity-70 text-xs font-semibold uppercase tracking-widest">
            <span class="flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i> System Ready</span>
            <span id="lock-status-text" class="clock-font opacity-80">Click Anywhere</span>
        </div>

        <div class="flex flex-col items-center justify-center my-auto space-y-6 text-center">
            <div id="lock-clock-display" class="clock-font text-6xl sm:text-9xl font-extralight tracking-tight drop-shadow-2xl">00:00</div>
            <div id="lock-date-display" class="text-xs sm:text-sm font-semibold tracking-[0.25em] uppercase opacity-60">Monday, Aug 31 2026</div>
            
            <div class="pt-10 flex flex-col items-center gap-4">
                <div class="w-14 h-14 rounded-full border border-white/20 flex items-center justify-center lock-pulse bg-white/5 shadow-2xl backdrop-blur-md">
                    <i data-lucide="lock" class="w-5 h-5 opacity-90"></i>
                </div>
                <span class="text-[11px] uppercase tracking-[0.2em] opacity-50 font-medium">Click or Press Any Key to Unlock</span>
            </div>
        </div>

        <div class="text-center text-[11px] tracking-widest uppercase opacity-30">
            Minimalist Security Gate
        </div>
    </div>

    <header id="main-header" class="w-full p-6 flex justify-between items-center max-w-6xl mx-auto z-30 relative transition-all duration-500">
        <div class="flex items-center gap-3">
            <span class="font-bold text-xs tracking-[0.25em] uppercase opacity-90">MINIMAL<span class="accent-text">CLOCK</span></span>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <button id="soundscape-btn" class="p-2.5 rounded-full glass-nav hover:bg-white/10 active:scale-95 flex items-center gap-2 text-xs font-medium">
                <i data-lucide="sliders" class="w-4 h-4 opacity-70"></i>
                <span class="hidden sm:inline">Soundscape</span>
            </button>

            <button id="zen-btn" class="p-2.5 rounded-full glass-nav hover:bg-white/10 active:scale-95 flex items-center gap-2 text-xs font-medium" title="Zen Mode (Z)">
                <i data-lucide="eye-off" class="w-4 h-4 opacity-70"></i>
                <span class="hidden sm:inline">Zen</span>
            </button>

            <button id="settings-btn" class="p-2.5 rounded-full glass-nav hover:bg-white/10 active:scale-95 flex items-center gap-2 text-xs font-medium" title="Settings (S)">
                <i data-lucide="settings" class="w-4 h-4 opacity-80"></i>
                <span class="hidden sm:inline">Settings</span>
            </button>

            <button id="sound-btn" class="p-2.5 rounded-full glass-nav hover:bg-white/10 active:scale-95" title="Mute/Unmute (M)">
                <i data-lucide="volume-x" id="sound-icon" class="w-4 h-4 opacity-70"></i>
            </button>

            <button id="fullscreen-btn" class="p-2.5 rounded-full glass-nav hover:bg-white/10 active:scale-95" title="Fullscreen (F)">
                <i data-lucide="maximize" class="w-4 h-4 opacity-70"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col justify-center items-center px-4 w-full z-10 max-w-6xl mx-auto py-6 relative">
        
        <div id="date-display" class="mb-8 text-xs sm:text-sm font-semibold
